# OrderIt API on Render (free web service). Secrets are marked sync: false and set in the dashboard / API,
# never committed. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: orderit-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev: NODE_ENV=production is set at build time, and "npm start" needs cross-env (a devDependency)
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: none
      - key: IMAGE_SOURCE
        value: dataset
      - key: LOG_FORMAT
        value: combined
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYMENT_SIMULATION_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
