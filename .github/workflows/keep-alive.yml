# Pings the API every 10 minutes so the Render free instance never spins down (cold starts take ~50s).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://orderit-mern-ecommerce.onrender.com/api/v1/health
